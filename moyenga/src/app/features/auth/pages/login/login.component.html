<section class="auth-form">
  <div class="auth-form__icon">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="8" r="4" /><path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
    </svg>
  </div>

  <h2>Connexion</h2>
  <p class="auth-form__subtitle">Retrouvez vos commandes et votre panier.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form__form">
    <label class="field">
      <span class="field__label">Email ou téléphone</span>
      <span class="field__input-wrap">
        <svg class="field__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" />
        </svg>
        <input
          type="text"
          formControlName="identifier"
          autocomplete="username"
          class="form-control"
          placeholder="vous@exemple.com"
        />
      </span>
    </label>

    <label class="field">
      <span class="field__label">Mot de passe</span>
      <span class="field__input-wrap">
        <svg class="field__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="4" y="10" width="16" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" />
        </svg>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="form-control"
          placeholder="••••••••"
        />
      </span>
    </label>

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }

    <button type="submit" class="btn btn-primary auth-form__submit" [disabled]="form.invalid || loading()">
      @if (loading()) {
        <span class="auth-form__spinner" aria-hidden="true"></span>
      }
      {{ loading() ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>

  <p class="auth-form__switch">
    Pas encore de compte ? <a routerLink="/auth/register">S'inscrire</a>
  </p>
</section>
