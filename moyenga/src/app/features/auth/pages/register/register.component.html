<section>
    <h2>Créer un compte</h2>

    @if (successMessage()) {
      <p class="success">{{ successMessage() }}</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <label>
          Prénom
          <input type="text" formControlName="firstName" />
        </label>

        <label>
          Nom
          <input type="text" formControlName="lastName" />
        </label>

        <label>
          Email
          <input type="email" formControlName="email" autocomplete="email" />
        </label>

        <label>
          Téléphone
          <input type="tel" formControlName="phone" placeholder="+22670000000" />
        </label>

        @if (form.hasError('identifierRequired') && form.touched) {
          <p class="error">Renseigne au moins un email ou un numéro de téléphone.</p>
        }

        <label>
          Mot de passe
          <input type="password" formControlName="password" autocomplete="new-password" />
        </label>

        @if (errorMessage()) {
          <p class="error">{{ errorMessage() }}</p>
        }

        <button type="submit" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Création...' : "S'inscrire" }}
        </button>
      </form>
    }

    <p>Déjà un compte ? <a routerLink="/auth/login">Se connecter</a></p>
</section>
