<header class="main-header">
    <a routerLink="/" class="logo">Moyenga</a>
    <nav>
      <a routerLink="/cart">Panier</a>
      @if (authService.isAuthenticated()) {
        <a routerLink="/account">Mon compte</a>
        <button type="button" (click)="authService.logout()">Déconnexion</button>
      } @else {
        <a routerLink="/auth/login">Connexion</a>
      }
    </nav>
  </header>

  <main>
    <router-outlet />
  </main>

  <footer class="main-footer">
    <p>&copy; {{ currentYear }} Moyenga</p>
  </footer>
